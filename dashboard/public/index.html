<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>DNS Manager</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpath d='M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div>
          <div class="brand">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18" />
            </svg>
            <span>DNS</span>
          </div>
          <p class="brand-sub">Record manager</p>
        </div>

        <nav class="nav" aria-label="Sections">
          <button
            class="nav-item"
            type="button"
            data-view="records"
            aria-current="page"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <ellipse cx="12" cy="5.5" rx="8" ry="3" />
              <path
                d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"
              />
            </svg>
            <span>Records</span>
            <span class="nav-count" data-count="records"></span>
          </button>
          <button class="nav-item" type="button" data-view="blocklist">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M5.6 5.6l12.8 12.8" />
            </svg>
            <span>Blocklist</span>
            <span class="nav-count" data-count="blocklist"></span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="status" data-status>
            <span class="status-dot" aria-hidden="true"></span>
            <span data-status-text>Connected</span>
          </div>
          <button
            class="btn btn-ghost"
            type="button"
            data-theme-toggle
            style="justify-content: flex-start"
          >
            <svg
              data-theme-icon="dark"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
            <svg
              data-theme-icon="light"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
              hidden
            >
              <circle cx="12" cy="12" r="4.5" />
              <path
                d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"
              />
            </svg>
            <span data-theme-label>Dark mode</span>
          </button>
        </div>
      </aside>

      <main class="main">
        <div class="topbar">
          <label class="search">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="M15.5 15.5L21 21" />
            </svg>
            <input
              class="input"
              type="search"
              data-search
              placeholder="Search domains"
              aria-label="Search domains"
            />
          </label>
        </div>

        <div class="content">
          <div class="banner" data-banner hidden>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
              style="width: 1rem; height: 1rem; flex-shrink: 0"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 8v4.5M12 16h.01" />
            </svg>
            <span data-banner-text></span>
          </div>

          <!-- Records view -->
          <section data-view-panel="records">
            <div class="page-head">
              <div>
                <h1 class="page-title">DNS Records</h1>
                <p class="page-sub" data-records-sub>
                  Records served straight from MongoDB, never cached.
                </p>
              </div>
              <button class="btn btn-primary" type="button" data-add-record>
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <path d="M12 5v14M5 12h14" />
                </svg>
                Add record
              </button>
            </div>

            <div class="filters">
              <select
                class="select"
                data-type-filter
                aria-label="Filter by record type"
              >
                <option value="">All types</option>
              </select>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th class="col-type">Type</th>
                    <th>Name</th>
                    <th>Content</th>
                    <th class="col-ttl">TTL</th>
                    <th class="col-actions">
                      <span class="sr-only">Actions</span>
                    </th>
                  </tr>
                </thead>
                <tbody data-records-body></tbody>
              </table>
            </div>
          </section>

          <!-- Blocklist view -->
          <section data-view-panel="blocklist" hidden>
            <div class="page-head">
              <div>
                <h1 class="page-title">Blocklist</h1>
                <p class="page-sub" data-blocklist-sub>
                  Blocked domains answer 0.0.0.0. Changes apply immediately, no
                  restart.
                </p>
              </div>
            </div>

            <div class="panel">
              <h2 class="panel-title">Add domains</h2>
              <textarea
                class="textarea textarea-bulk"
                data-block-input
                rows="4"
                placeholder='ads.example.com&#10;tracker.example.net&#10;&#10;Paste one per line. Hosts file lines like "0.0.0.0 ads.example.com" work too.'
                aria-label="Domains to block"
              ></textarea>
              <div class="field-error" data-block-error hidden></div>
              <div class="panel-actions">
                <button class="btn btn-primary" type="button" data-block-submit>
                  Block domains
                </button>
                <span class="panel-note"
                  >Newline, comma or hosts file format</span
                >
              </div>
            </div>

            <div class="table-wrap">
              <ul class="domain-list" data-blocklist-body></ul>
            </div>

            <div class="pagination" data-pagination hidden>
              <span class="pagination-info" data-pagination-info></span>
              <div class="pagination-buttons">
                <button class="btn" type="button" data-page-prev>
                  Previous
                </button>
                <button class="btn" type="button" data-page-next>Next</button>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- Delete confirmation -->
    <div
      class="modal"
      data-modal
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-message"
    >
      <div class="modal-card">
        <button
          class="btn btn-icon modal-close"
          type="button"
          data-modal-cancel
          aria-label="Close"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
        <div class="modal-body">
          <p class="modal-message" id="modal-message" data-modal-message></p>
          <p class="modal-target mono" data-modal-target></p>
        </div>
        <div class="modal-buttons">
          <button class="btn btn-danger" type="button" data-modal-confirm>
            Delete
          </button>
          <button class="btn" type="button" data-modal-cancel>Cancel</button>
        </div>
      </div>
    </div>

    <div
      class="toasts"
      data-toasts
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
