services:
  mongodb:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - mongo-dns-data:/data/db

  redis:
    image: redis:latest
    restart: unless-stopped

  dns-server:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - 53:53/udp
      - 53:53/tcp
      # Dashboard is published on loopback only, it has no authentication
      - 127.0.0.1:8053:8053
    environment:
      - REDIS_HOST=redis
      - MONGO_DB_URL=mongodb://mongodb:27017/dns
      - DASHBOARD_PORT=8053
      # Must bind all interfaces inside the container for the mapping above to work
      - DASHBOARD_HOST=0.0.0.0
    depends_on:
      - mongodb
      - redis
    restart: on-failure:5

volumes:
  mongo-dns-data: {}
